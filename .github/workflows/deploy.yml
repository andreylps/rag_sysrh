name: Deploy Profissional VPS

on:
  push:
    branches: ["main_1"]

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔐 Configuração SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Executar Deploy na VPS
        run: |
          # Adiciona o host para evitar prompt de confirmação
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # Conecta e executa os comandos remotamente
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e # Para o script se qualquer comando falhar

            # --- Configurações do Caminho ---
            PROJECT_PATH="/noesys_deploy/RAG_SYSRH"
            REPO_URL="https://github.com/andreylps/rag_sysrh.git"
            # --------------------------------

         

            echo "🔍 Verificando diretório do projeto em: $PROJECT_PATH"

            if [ -d "$PROJECT_PATH" ]; then
              # --- CENÁRIO 1: O projeto já existe ---
              echo "📂 Pasta encontrada. Forçando atualização para a versão mais recente..."
              cd "$PROJECT_PATH"
              
              # --- NOVOS COMANDOS GIT (Mais robustos) ---
              # 1. Busca as informações mais recentes do remoto sem baixar os arquivos ainda
              git fetch origin main
              
              # 2. FORÇA (hard reset) a pasta local a ficar IDÊNTICA à versão do GitHub
              # Isso evita conflitos e o erro de branch desconhecida.
              git reset --hard origin/main
              # ----------------------------------------
              
          
            else
              # --- CENÁRIO 2: Primeira vez (pasta não existe) ---
              echo "🤷‍♂️ Pasta não encontrada. Realizando o primeiro clone..."
              # Cria o diretório pai se necessário (ex: /noesys_deploy)
              mkdir -p "$(dirname "$PROJECT_PATH")"
              # Clona o projeto para a pasta destino
              git clone "$REPO_URL" "$PROJECT_PATH"
              # Entra na pasta recém-criada
              cd "$PROJECT_PATH"
              echo "✅ Clone inicial concluído com sucesso."
            fi

            # --- A partir daqui, já estamos dentro da pasta correta ---

           # --- A partir daqui, já estamos dentro da pasta correta ---

            echo "📦 Instalando/Atualizando dependências com uv..."
            # Garante que o uv está instalado (caso a VPS seja nova)
            if ! command -v uv &> /dev/null; then
                echo "Installing uv..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                # --- LINHA CORRIGIDA AQUI: ---
                export PATH="$HOME/.local/bin:$PATH"
                # -----------------------------
            fi
            
            # Garante que o caminho esteja visível mesmo se o uv já estava instalado
            export PATH="$HOME/.local/bin:$PATH"

            echo "Sincronizando dependências..."
            uv sync

            # Nota: Os comandos de systemd vão falhar agora porque o serviço 
            # ainda não foi criado. Vamos manter comentado por enquanto.
            # echo "🔄 Reiniciando serviço Systemd..."
            # sudo systemctl restart rag_sysrh.service

            echo "✅ Deploy concluído com sucesso! (Código e dependências prontos)"
          EOF

# Trigger update
