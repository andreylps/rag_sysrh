name: Deploy Profissional VPS

on:
  push:
    branches: ["main_1"]

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔐 Configuração SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Executar Deploy na VPS
        run: |
          # Adiciona o host para evitar prompt de confirmação
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # Conecta e executa os comandos remotamente
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e # Para o script se qualquer comando falhar

            # --- Configurações do Caminho ---
            PROJECT_PATH="/root/noesys_deploy/RAG_SYSRH"
            FRONTEND_PATH="$PROJECT_PATH/src/frontend"
            NGINX_PATH="/var/www/html/rag_sysrh"
            REPO_URL="https://github.com/andreylps/rag_sysrh.git"
            # --------------------------------

            echo "🔍 Verificando diretório do projeto em: $PROJECT_PATH"

            if [ -d "$PROJECT_PATH" ]; then
              echo "📂 Pasta encontrada. Forçando atualização para a versão mais recente..."
              cd "$PROJECT_PATH"
              git fetch origin main_1
              git reset --hard origin/main_1
            else
              echo "🤷‍♂️ Pasta não encontrada. Realizando o primeiro clone..."
              mkdir -p "$(dirname "$PROJECT_PATH")"
              git clone "$REPO_URL" "$PROJECT_PATH"
              cd "$PROJECT_PATH"
              echo "✅ Clone inicial concluído com sucesso."
            fi

            # --- ATUALIZAÇÃO DO BACKEND (PYTHON) ---
            echo "🐍 [BACKEND] Instalando/Atualizando dependências com uv..."
            export PATH="$HOME/.local/bin:$PATH"
            if ! command -v uv &> /dev/null; then
                echo "Installing uv..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            uv sync

            # --- ATUALIZAÇÃO DO FRONTEND (REACT/VITE) ---
            echo "⚛️ [FRONTEND] Iniciando build..."
            cd "$FRONTEND_PATH"
            
            echo "📦 Instalando dependências do Node (npm install)..."
            npm install

            echo "🔨 Construindo a aplicação (npm run build)..."
            npm run build

            echo "🚚 Movendo arquivos para o servidor Nginx..."
            # Garante que a pasta destino existe
            sudo mkdir -p "$NGINX_PATH"
            # Sincroniza a pasta dist com a pasta do Nginx
            sudo rsync -av --delete dist/ "$NGINX_PATH/"

            # --- FINALIZAÇÃO ---
            echo "🔄 Reiniciando serviço Systemd do Backend..."
            sudo systemctl restart noesys-backend.service

            echo "✅ DEPLOY COMPLETO COM SUCESSO! (Backend + Frontend atualizados)"
          EOF

# Trigger update
