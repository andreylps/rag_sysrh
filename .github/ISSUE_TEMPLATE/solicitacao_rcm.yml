name: Solicitação de RCM
description: Template para solicitação de Mudança (RCM) gerada pelo Agente SYSRH.
title: "[RCM] "
labels: ["RCM", "Pendente Aprovação"]
body:
  - type: markdown
    attributes:
      value: |
        ## Solicitação de Mudança (RCM)
        Esta issue foi gerada automaticamente pelo Agente de Planejamento do SYSRH.

  - type: dropdown
    id: tipo_solicitacao
    attributes:
      label: Tipo de Solicitação
      options:
        - Corretiva
        - Evolutiva
        - Consultiva
        - Outro
    validations:
      required: true

  - type: textarea
    id: descricao_problema
    attributes:
      label: Descrição do Problema / Melhoria
      description: Detalhes técnicos e funcionais da solicitação.
      placeholder: Descreva o que precisa ser feito...
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options:
        - Baixa
        - Média
        - Alta
        - Crítica
    validations:
      required: true

  - type: input
    id: esforco_estimado
    attributes:
      label: Esforço Estimado (PF/Horas)
      description: Preenchido pelo Agente.
      placeholder: Ex: 10 PF
    validations:
      required: false

  - type: input
    id: data_entrega
    attributes:
      label: Data Prevista de Entrega
      description: Preenchido pelo Agente.
      placeholder: YYYY-MM-DD
    validations:
      required: false
