name: 🚀 Nova Solicitação / RCM
description: Registre uma demanda, bug ou mudança para o sistema.
title: "[RCM]: "
labels: ["status: pendente"]
body:
  - type: markdown
    attributes:
      value: |
        ### Formulário de Solicitação SYSRH
        Preencha os campos abaixo para iniciar o fluxo do Agente.

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de Solicitação
      options:
        - ✨ Nova Funcionalidade
        - 🐛 Correção de Bug
        - 🔧 Melhoria Técnica
        - 📄 Documentação
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição Detalhada
      description: O que precisa ser feito?
      placeholder: "Descreva a necessidade..."
    validations:
      required: true

  - type: input
    id: esforco
    attributes:
      label: Esforço Estimado (Horas)
      placeholder: "Ex: 8"

  - type: input
    id: data_entrega
    attributes:
      label: Data de Entrega Desejada
      placeholder: "DD/MM/AAAA"
