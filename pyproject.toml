[project]
name = "rag_sysrh"
version = "0.1.0"
description = "Assistente de Conhecimento SYSRH com RAG e Agentes Autônomos."
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
requires-python = ">=3.11"

dependencies = [
    # Core application framework
    "streamlit",
    "protobuf<5", # Pinned for streamlit compatibility

    # LangChain components
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-neo4j",
    "langchain-classic", # For ConversationBufferMemory
    "langchain-smith",   # Adiciona o cliente do LangSmith
    "langgraph",

    # Data handling and analysis
    "pandas",
    "altair",
    "ftfy",
    "python-dateutil", # Dependency for pandas

    # Document loaders & Environment
    "pypdf",
    "docx2txt",
    "unstructured[xlsx]",
    "python-dotenv",

    # Core agent dependencies
    "neo4j",
    "openai",
    "pydantic",
]

[tool.setuptools]
# Isso informa ao setuptools para procurar pacotes dentro do diretório 'src'
package-dir = {"" = "src"}
packages = ["rag_sysrh"]