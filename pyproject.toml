[project]
name = "rag_sysrh"
version = "0.1.0"
description = "Assistente de Conhecimento SYSRH com RAG e Agentes Autônomos."
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
requires-python = ">=3.11"

dependencies = [
    # Core application framework
    "streamlit",
    "protobuf<5", # Fixado para compatibilidade com streamlit
    # LangChain Stack (Moderna)
    "langchain", # Pacote principal (inclui Memory, Chains)
    "langchain-core", # Abstrações base
    "langchain-community", # Integrações de terceiros
    "langchain-openai", # Integração OpenAI
    "langchain-neo4j", # Integração Neo4j
    "langchain-text-splitters", # Para RecursiveCharacterTextSplitter
    "langsmith", # Observabilidade e Avaliação
    "langgraph", # Orquestração de Agentes
    # Data handling and analysis
    "pandas",
    "altair",
    "ftfy",
    "python-dateutil",
    "openpyxl", # Necessário para pandas ler Excel (.xlsx)
    # Document loaders & Environment
    "pypdf",
    "docx2txt",
    "python-docx",
    "unstructured[xlsx]",
    "python-dotenv",
    # Core agent dependencies
    "neo4j",
    "openai",
    "pydantic",
    "guardrails-ai",
    "uvicorn",
    "fastapi",
    "python-multipart",
    "PyGithub",
    "watchdog",
    "duckduckgo-search",
    "langchain-google-genai>=3.2.0",
    "apscheduler>=3.11.1",
    "reportlab>=4.4.5",
]

[tool.setuptools]
# Isso informa ao setuptools para procurar pacotes dentro do diretório 'src'
package-dir = {"" = "src"}
packages = ["rag_sysrh"]
